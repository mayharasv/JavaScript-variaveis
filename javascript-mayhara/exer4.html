<html>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exer4</title>
        <script>

            // QUESTÃO 4
            var distancia = Number(prompt('Distância da viagem: '))
            var con_medio = Number(prompt('Consumo médio do veículo em quilômetros por litro: '))
            var preco = Number(prompt('Preço do combustível: '))
            let soma = (distancia / con_medio) * preco

            alert('O valor estimado gasto com combustível é ' + soma)

        </script>
    </head>
</html>
