<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exer9</title>
        <script>

            // QUESTÃO 9
            var dias = Number(import('Digite uma quantidade de dias: '))
            let hora = dias * 24
            let c_min = 24 * 60
            let minuto = dias * c_min
            let c_seg = c_min * 60
            let segundo = dias * c_seg

            alert(dias + ' dias tem ' + hora + ' horas, ' + minuto + ' minutos e ' + segundo + ' segundos')

        </script>
    </head>
</html>
